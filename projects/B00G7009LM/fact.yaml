customer_problem:
  primary: "Cold drafts and heat loss around older or poorly insulated windows during winter."
  secondary:
    - "Rooms that feel chilly near windows"
    - "A low-cost seasonal DIY option for reducing air movement around window frames"
    - "Homeowners who want to cover more than one standard-size window with one purchase"

benefits:
  - "Can add a temporary insulating air barrier over a window."
  - "May help reduce drafts when installed correctly on a compatible, clean frame."
  - "Clear film allows light through, though it is not optically identical to glass."
  - "Three sheets can cover several windows if each window fits the supplied dimensions."
  - "The heat-shrink method can produce a tighter, neater finish than loose, wrinkled plastic."

limitations_and_cautions:
  - "This is a seasonal film-and-tape solution, not a permanent window replacement or repair."
  - "Each sheet is 42 x 62 inches; measure the window and frame before buying."
  - "Installation requires careful surface preparation, cutting, tape application, and a hair dryer."
  - "Adhesive may leave residue or affect delicate, poorly bonded, freshly painted, or otherwise incompatible finishes; test a discreet area and follow package instructions."
  - "The film is not glass and may slightly affect the view."
  - "The film covers the window area, so normal access to or opening of the covered window may be inconvenient until removed."
  - "Do not describe it as pet-proof or child-proof. Heavy-duty film is still plastic film and can be punctured or damaged."
  - "No guaranteed energy-bill savings should be claimed. Results depend on the window, installation, weather, and home."

hands_on_notes:
  - "Practical interpretation, not personal testing: the heavy-duty film and wider tape are intended to provide a sturdier temporary barrier than a basic shrink-film kit."
  - "The three-pack is most useful when several standard windows need winter treatment; it is less suitable if windows exceed the sheet dimensions."
  - "The finish depends heavily on cleaning and drying the frame, applying tape evenly, and shrinking the film gradually with a hair dryer."
  - "Buyers should weigh the low-cost seasonal approach against the annual work of installing and removing film, and against alternatives such as weatherstripping, thermal curtains, or a fitted interior window insert."
  - "Do not imply the product was personally installed or tested unless the creator actually tests it."

buying_criteria:
  - "Measure the window area and check that 42 x 62 inches is sufficient."
  - "Confirm the frame surface is compatible with adhesive tape."
  - "Check that the package contains three sheets and the mounting tape."
  - "Consider whether the window needs to remain accessible or open during the season."
  - "Compare the cost and effort with weatherstripping or other window-insulation options."

