# ------------------------------------------------------------------
# Copy this whole folder to projects/<ASIN>/ and fill it in.
# The script writer may ONLY use what is written here. Anything you
# leave out will simply not be said. More real facts = better video.
# ------------------------------------------------------------------
asin: B0XXXXXXXX                 # must match the folder name
product_name: "Brand Model Name 20 oz Insulated Bottle"
brand: "Brand"
short_name: "Brand"            # short label used in comparison videos (optional)
category: "insulated water bottle"        # plain words: what kind of product is it?
audience: "people who carry a drink to work or the gym"

# Phrases viewers search for (5-15 is plenty; the first one goes into the video title). Optional.
keywords:
  - insulated water bottle
  - best water bottle for gym

# Your Amazon affiliate link (SiteStripe short link amzn.to/xxxx, or an amazon.* link with your tag=).
# Third-party link shorteners / cloakers are not allowed in Associates.
affiliate_url: "https://amzn.to/XXXXXXX"

# What the brand/listing SAYS (the video will attribute these: "the brand says ...").
# Type them yourself in your own words. Do not paste customer reviews, prices or star ratings.
manufacturer_claims:
  - "Double-wall vacuum insulation"
  - "Lid is leak resistant"

# Hard specs you can verify on the product / box / brand site.
specs:
  - "Capacity: 20 ounces"
  - "Weight: 14 ounces empty"
  - "Fits most standard cup holders"

# YOUR OWN observations from actually handling the product. This is what makes the video
# yours (and keeps it clear of YouTube's 'inauthentic content' rules). Aim for 6+ lines.
hands_on_notes:
  - "The lid needs a firm quarter turn to seal; easy with one hand once you know it"
  - "Powder coat feels grippy but shows fingerprints"

pros:
  - "Fits my car cup holder"
cons:
  - "No carry handle"
not_for:
  - "Anyone who wants a straw lid"

# Optional extras
use_cases: ["commuting", "gym bag", "desk"]
notes: ""
# angle: honest_pros_cons        # force a specific video angle (otherwise rotates automatically)
# assets_allow: [03_closeup.jpg] # files the face/price checker flagged wrongly
