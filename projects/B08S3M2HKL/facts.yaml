use_cases: ["warm house", "winter comfort", "air sealing"]
notes: "SEO keyword guidance:
  - Use "No more cold drafts" as a problem-focused hook, not as a guarantee that every draft will disappear.
  - Naturally use "seals gaps around windows and doors" to explain the product's main purpose.
  - Use "keep your house warm" and "Winter weather" in the context of improving indoor comfort by addressing suitable gaps.
  - Use "drafty gaps" when describing the problem the product is designed to address.
  - Explain the transparent silicone flap, approximately 49-foot total length, three-roll package, and measure-cut-and-stick installation.
  - Distinguish this product from window insulation film kits and freestanding weighted door draft stoppers.
  - Do not promise complete draft elimination, guaranteed energy savings, or a specific indoor temperature increase.
  - Do not invent firsthand testing, customer feedback, prices, ratings, or review counts.
  - Keep the script focused on practical winter weatherproofing for a US audience.
  - Use the Amazon Associates URL above as the affiliate link. Do not substitute another link unless instructed."
