# ---------------------------------------------------------------
# Amazon Ad Agent - settings.  Edit freely; nothing here is secret.
# ---------------------------------------------------------------
video:
  width: 1920
  height: 1080
  fps: 30
  crf: 18            # lower = better quality, bigger file (17-20 is good)
  preset: medium     # slower = smaller file. medium is fine.
  shot_seconds: 5.0  # average length of one shot
  crossfade: 0.35    # set per template (templates: ... transition)
  template: best     # one | two | three | four | best   (see templates: below; choose in the workflow dropdown)
  accent_color: [255, 176, 0]   # callout accent bar (R,G,B)
  cinematic: true         # TV-commercial style product shots from clean studio photos (free, no AI model)
  cinematic_share: 0.6    # share of eligible photo shots that use it (the rest use normal pan/zoom)
  fonts:             # first one that exists is used
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
    - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
    - C:/Windows/Fonts/arialbd.ttf

length:              # defaults = a single-product review; comparison and list videos use their own presets below
  min_minutes: 3.5
  max_minutes: 8.0
  target_minutes: 5.0
  wpm: 155           # narration speed used for the pre-voice estimate
  lead_in: 0.8       # seconds of picture before the voice starts
  tail: 4.0          # seconds of end card after the voice ends

length_presets:      # picked automatically by video type; 'short' can be chosen in the workflow for any type
  review:  {min_minutes: 3.5, max_minutes: 8.0, target_minutes: 5.0}    # single product
  compare: {min_minutes: 5.5, max_minutes: 8.8, target_minutes: 7.5}    # 2-3 products
  list:    {min_minutes: 5.5, max_minutes: 8.8, target_minutes: 7.5}    # Top N (3-9 products)
  short:   {min_minutes: 1.5, max_minutes: 4.8, target_minutes: 3.0}
  # every video stays under 9 minutes

# ---- visual templates (pick with the 'template' dropdown). caption styles: pill | light | solid | outline | glass
# grade: contrast, brightness, saturation, tint [R,G,B offsets], vignette (0-0.5), grain (0-0.05). letterbox = black bar height share.
# transition kinds: fade | slide | dip.  backdrop (cinematic product shots): studio | light | vivid | dark | pastel
templates:
  one:
    label: "Clean & minimal"
    accent: [47, 111, 237]
    caption: {style: light}
    grade: {contrast: 1.00, brightness: 0, saturation: 1.00, tint: [0, 0, 0], vignette: 0.06, grain: 0.0}
    letterbox: 0.0
    transition: {kind: fade, seconds: 0.40}
    backdrop: light
    badge: outline
    endcard: {bg: [246, 247, 250, 238], text: [24, 26, 31]}
  two:
    label: "Bold & vibrant"
    accent: [255, 61, 127]
    caption: {style: solid}
    grade: {contrast: 1.08, brightness: -2, saturation: 1.28, tint: [0, 0, 0], vignette: 0.14, grain: 0.0}
    letterbox: 0.0
    transition: {kind: slide, seconds: 0.35}
    backdrop: vivid
    badge: solid
    endcard: {bg: [40, 10, 44, 220], text: [255, 255, 255]}
  three:
    label: "Dark cinematic"
    accent: [255, 196, 87]
    caption: {style: outline}
    grade: {contrast: 1.14, brightness: -6, saturation: 0.92, tint: [-6, 0, 8], vignette: 0.38, grain: 0.025}
    letterbox: 0.085
    transition: {kind: dip, seconds: 0.55}
    backdrop: dark
    badge: glow
    endcard: {bg: [5, 6, 9, 222], text: [255, 255, 255]}
  four:
    label: "Modern glass"
    accent: [64, 224, 208]
    caption: {style: glass}
    grade: {contrast: 1.05, brightness: -2, saturation: 1.06, tint: [0, 0, 0], vignette: 0.16, grain: 0.0}
    letterbox: 0.0
    transition: {kind: fade, seconds: 0.45}
    backdrop: pastel
    badge: glass
    endcard: {bg: [18, 24, 36, 212], text: [255, 255, 255]}
  best:
    label: "Modern (default)"
    accent: [255, 176, 0]
    caption: {style: pill}
    grade: {contrast: 1.04, brightness: -4, saturation: 1.00, tint: [0, 0, 0], vignette: 0.28, grain: 0.0}
    letterbox: 0.0
    transition: {kind: fade, seconds: 0.35}
    backdrop: studio
    badge: solid
    endcard: {bg: [8, 8, 10, 175], text: [255, 255, 255]}

# ---- AI ad-clip scenes (see notebooks/make_ai_clips.ipynb)
scenes:
  count: 10               # scenes planned per product
  max_product_scenes: 6   # clips animated from YOUR product photos (commercial camera/light moves only); the rest are faceless mood scenes

llm:
  provider: groq                                   # groq (free tier available) or anthropic (paid)
  model: openai/gpt-oss-120b                       # script writing + fact check
  vision_model: qwen/qwen3.8-27b                   # looks at your photos/clips (Qwen 3.8 is multimodal)
  vision_fallbacks:       # used in order when vision_model hits its DAILY limit (check these names at console.groq.com/docs/models;
    - qwen/qwen3.6-27b    # a name your account does not have is skipped automatically)
    - meta-llama/llama-4-scout-17b-16e-instruct
    - meta-llama/llama-4-maverick-17b-128e-instruct
  text_fallbacks:         # the same idea for writing the script
    - openai/gpt-oss-20b
    - qwen/qwen3-32b
  groq_max_tokens: 6500
  vision_check: true      # false = skip the AI photo check (saves Groq tokens; you then check faces/prices yourself)
  vision_max_side: 640    # photos are shrunk to this size for the AI check (cheaper; the product is still clearly visible)                            # keeps requests inside free-tier per-minute limits
  # For Anthropic instead: provider: anthropic, model: claude-sonnet-5-5, vision_model: claude-sonnet-5-5
  # Check current Groq model names at console.groq.com/docs/models

voice:
  default: eleven_female
  # Switch voice with --voice KEY (or the dropdown in the GitHub workflow).
  options:
    eleven_female:   {provider: elevenlabs, voice_id: EXAVITQu4vr4xnSDxMaL, label: "ElevenLabs - Sarah (F)"}
    eleven_female_2: {provider: elevenlabs, voice_id: FGY2WhTYpPnrIDTdsKH5, label: "ElevenLabs - Laura (F)"}
    eleven_male:     {provider: elevenlabs, voice_id: nPczCjzI2devNBz1zQrb, label: "ElevenLabs - Brian (M)"}
    eleven_male_2:   {provider: elevenlabs, voice_id: CwhRBWXzGAHq8TQ4Fs17, label: "ElevenLabs - Roger (M)"}
    edge_female:     {provider: edge, voice: en-US-AvaMultilingualNeural,    label: "Edge neural - Ava (F)"}
    edge_female_2:   {provider: edge, voice: en-US-EmmaMultilingualNeural,   label: "Edge neural - Emma (F)"}
    edge_male:       {provider: edge, voice: en-US-AndrewMultilingualNeural, label: "Edge neural - Andrew (M)"}
    edge_male_2:     {provider: edge, voice: en-US-BrianMultilingualNeural,  label: "Edge neural - Brian (M)"}
    openai_female:   {provider: openai, voice: nova,  label: "OpenAI - Nova (F)"}
    openai_male:     {provider: openai, voice: onyx,  label: "OpenAI - Onyx (M)"}
  elevenlabs:
    model_id: eleven_multilingual_v2   # best quality, 1 credit/char.  eleven_flash_v2_5 = 0.5 credit/char, less natural
    credits_per_char: 1.0              # set 0.5 if you switch to a flash/turbo model
    stability: 0.45                    # lower = more expressive
    similarity_boost: 0.80
    style: 0.20
  openai:
    model: gpt-4o-mini-tts
    instructions: "Warm, relaxed, conversational. Natural pacing with small pauses. Sound like a person talking to a friend, not reading an ad."
  pause_sentence: 0.40   # seconds of silence after each narration line
  pause_section: 0.75    # extra pause when the section changes

cta:                 # subscribe ask in the intro (like + share are only in the outro)
  intro: true
  intro_position: after_hook      # after_hook = after the first hook line (keeps the hook first) | start
  intro_lines:
    - "If you haven't yet, please subscribe to the channel. Now, let's get into it."
    - "Quick favour: if you haven't subscribed yet, please do. Alright, let's get started."
    - "If you're new here, subscribe to the channel. Let's dive in."

disclosure:
  # Where the affiliate disclosure appears INSIDE the video (the description and pinned comment always carry it):
  #   full             = spoken line + on-screen banner + "Contains affiliate links" tag + end-card line
  #   on_screen        = text on screen only (about 6 seconds near the start, plus the end card); NO voice-over line
  #   description_only = nothing inside the video; only description.txt and pinned_comment.txt
  # The FTC says a disclosure in the video itself is clearer than one in the description box; on_screen is the middle option.
  mode: description_only
  spoken:
    - "Quick note before we get into it: the link below is an affiliate link, and as an Amazon Associate I earn from qualifying purchases."
    - "Before we start, I should say this video has an affiliate link, and as an Amazon Associate I earn from qualifying purchases."
    - "One thing up front: I use affiliate links, and as an Amazon Associate I earn from qualifying purchases."
  on_screen: "As an Amazon Associate I earn from qualifying purchases."
  tag: "Contains affiliate links"
  ai_voice_note: "Narration in this video is AI-generated."
  ai_tag: "AI-generated scene"
  ai_scenes_note: "Some scenes in this video are AI-generated."
  outro:       # subscribe + like + share (the intro only asks for a subscribe; see cta: above)
    - "If this helped, please subscribe, give it a like, and share it with someone who might need it. The link is in the description. Thanks for watching."
    - "That's the rundown. If it was useful, subscribe, like the video, and share it with a friend. The link is in the description."
    - "Thanks for watching. Please subscribe, like the video, and share it with someone who could use it. You'll find the link in the description."
  outro_compare:
    - "If this helped you choose, please subscribe, like the video, and share it with someone who might need it. The links are in the description, each next to its name."
    - "That's the comparison. If it was useful, subscribe, like, and share it with a friend. You'll find a link for each product in the description."
    - "Thanks for watching. Please subscribe, like, and share this with someone deciding between these products. Every link is in the description."
  outro_list:
    - "If this list helped, please subscribe, like the video, and share it with someone who might need it. Every product is linked in the description."
    - "That's the list. If it was useful, subscribe, like, and share it with a friend. You'll find a link for each product in the description."
    - "Thanks for watching. Please subscribe, like, and share this list with someone who might need it. Every link is in the description."
  outro_plain:   # used only when your own script already ends with a subscribe/share ask
    - "The link is in the description. Thanks for watching."
    - "You'll find the link or links in the description. Thanks for watching."

safety:
  max_videos_per_day: 2        # anti mass-production brake (override with --force)
  max_similarity: 0.22         # 4-gram overlap with your earlier scripts; above this the script is regenerated
